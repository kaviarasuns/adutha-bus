name = "adutha-bus-reports"
main = "report-worker.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://adutha-bus.pages.dev"

# Create the namespace with `wrangler kv namespace create REPORTS` and paste its id here.
[[kv_namespaces]]
binding = "REPORTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
